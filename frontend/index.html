<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Plataforma GAIT</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #eef2f6; margin: 0; }
        .login-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 340px; text-align: center; }
        h2 { color: #0d47a1; margin-bottom: 5px; }
        p { color: #555; font-size: 13px; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #0d47a1; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: #08306b; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Portal GAIT</h2>
        <p>Governança de Ativos em Infraestrutura Tecnológica</p>
        <input type="text" id="usuario" placeholder="Usuário (ex: gestor.ti)">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="fazerLogin()">Entrar no Sistema</button>
    </div>

    <script>
        function fazerLogin() {
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            if (!usuario || !senha) return alert('Preencha usuário e senha!');
            window.location.href = 'ativos.html';
        }
    </script>
</body>
</html>
