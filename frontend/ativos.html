<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GAIT - Destinação de Ativos de TI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #eef2f6; }
        .container { max-width: 750px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #0d47a1; text-align: center; margin-bottom: 5px; }
        .subtitulo { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #0d47a1; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #08306b; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #0d47a1; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GAIT - Destinação de Ativos em Fim de Ciclo</h1>
        <p class="subtitulo">Avaliação automática de telemetria para reaproveitamento ou descarte certificado</p>

        <div class="form-group">
            <input type="text" id="equipamento" placeholder="Equipamento / Série (ex: Servidor GPU A100 - SN99)">
            <input type="number" id="horas_uso" placeholder="Horas de Operação (ex: 18000)">
            <button onclick="avaliarAtivo()">Avaliar e Registrar</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ativo de TI (Hardware)</th>
                    <th>Telemetria (Horas)</th>
                    <th>Destino Recomendado (GAIT)</th>
                </tr>
            </thead>
            <tbody id="tabela-ativos"></tbody>
        </table>
    </div>

    <script>
        function listarAtivos() {
            fetch('http://localhost:5000/ativos')
                .then(res => res.json())
                .then(dados => {
                    const tbody = document.getElementById('tabela-ativos');
                    tbody.innerHTML = '';
                    dados.forEach(item => {
                        tbody.innerHTML += `<tr>
                            <td>${item.id}</td>
                            <td>${item.equipamento}</td>
                            <td>${item.horas_uso} h</td>
                            <td><strong>${item.destino_recomendado}</strong></td>
                        </tr>`;
                    });
                })
                .catch(err => console.error('Erro ao buscar ativos:', err));
        }

        function avaliarAtivo() {
            const equipamento = document.getElementById('equipamento').value;
            const horas_uso = parseInt(document.getElementById('horas_uso').value);
            if (!equipamento || isNaN(horas_uso)) return alert('Preencha o equipamento e as horas de uso!');

            fetch('http://localhost:5000/ativos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ equipamento, horas_uso })
            })
            .then(res => res.json())
            .then(resp => {
                alert(resp.mensagem);
                document.getElementById('equipamento').value = '';
                document.getElementById('horas_uso').value = '';
                listarAtivos();
            })
            .catch(err => alert('Erro ao conectar com a API Python do GAIT.'));
        }

        window.onload = listarAtivos;
    </script>
</body>
</html>
